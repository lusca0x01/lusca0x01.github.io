<!DOCTYPE html>
<html lang="pt-BR" class="no-js">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="lusca0x01 Blog - InfoSec, Pentesting, Análise de Malware e mais. Compartilhando conhecimento sobre segurança da informação.">
  <title>lusca0x01 Blog</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script>
    document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
  </script>
</head>

<body class="home">
  <div class="navbar">
    <div class="navbar-inner">
      <div class="navbar-menu">
        <nav id="site-nav" class="greedy-nav">
          <a class="site-title" href="/">lusca0x01 Blog</a>
          <ul class="visible-links">
            <li class="navbar-menu-item">
              <a href="/" data-i18n="nav.posts">Posts</a>
            </li>
            <li class="navbar-menu-item">
              <a href="/about/" data-i18n="nav.about">Sobre</a>
            </li>
            <li class="navbar-menu-item">
              <button class="lang-toggle" onclick="toggleLanguage()" title="Toggle Language">
                <span id="lang-btn">EN</span>
              </button>
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </div>

  <div class="initial-content">
    <div id="main" role="main">
      <div class="sidebar">
        <div class="author-box" itemscope itemtype="https://schema.org/Person">
          <div class="author-avatar">
            <img src="images/avatar.png" alt="Author" itemprop="image">
          </div>
          <div class="author-content">
            <h3 class="author-name" itemprop="name" data-i18n="author.name">lusca0x01</h3>
            <div class="author-bio" itemprop="description" data-i18n="author.bio">Threat Researcher and Maker</div>
          </div>
          <div class="author-urls-wrapper">
            <ul class="author-urls social-icons">
              <li><i class="fas fa-fw fa-map-marker-alt"></i> <span data-i18n="author.location">Fortaleza, Ceará,
                  Brasil</span></li>
              <li><a href="https://github.com/lusca0x01" target="_blank" rel="noopener noreferrer"><i
                    class="fab fa-fw fa-github"></i>
                  <span>GitHub</span></a></li>
              <li><a href="mailto:lucas.wf@outlook.com" target="_blank" rel="noopener noreferrer"><i
                    class="fas fa-fw fa-envelope"></i>
                  <span>Email</span></a></li>
              <li><a href="https://www.linkedin.com/in/lucas-wagner-fernandes/" target="_blank"
                  rel="noopener noreferrer"><i class="fab fa-fw fa-linkedin"></i>
                  <span>LinkedIn</span></a></li>
            </ul>
          </div>
        </div>
      </div>

      <div class="posts">
        <h3 class="posts-subtitle" data-i18n="posts.recent">Posts Recentes</h3>
        <div class="entries-list" id="posts-container">
        </div>

        <nav class="pagination" id="pagination">
        </nav>
      </div>
    </div>
  </div>

  <div id="footer" class="footer">
    <footer>
      <div class="footer-follow">
        <p data-i18n="footer.text">&copy; 2026 lusca0x01 Blog. Todos os direitos reservados.</p>
      </div>
    </footer>
  </div>

  <script src="/assets/js/script.js"></script>
</body>

</html>
