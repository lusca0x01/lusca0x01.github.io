<!DOCTYPE html>
<html lang="pt-BR" class="no-js">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Página não encontrada</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script>
    document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
  </script>
</head>

<body class="home">
  <div class="navbar">
    <div class="navbar-inner">
      <div class="navbar-menu">
        <nav id="site-nav" class="greedy-nav">
          <a class="site-title" href="/">lusca0x01 Blog</a>

          <ul class="visible-links">
            <li class="navbar-menu-item">
              <a href="/">Posts</a>
            </li>

            <li class="navbar-menu-item">
              <a href="/about/">Sobre</a>
            </li>

            <li class="navbar-menu-item">
              <button class="lang-toggle" onclick="toggleLanguage()" title="Toggle Language">
                <span id="lang-btn">EN</span>
              </button>
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </div>

  <div class="initial-content">
    <div class="error-container">
      <h1 class="error-code">404</h1>
      <p data-i18n="page.notfound" class="error-message">Página não encontrada</p>
      <p data-i18n="page.notfound.desc" class="error-description">
        Desculpe, a página que você está procurando não existe ou foi movida.
      </p>
    </div>
  </div>

  <div id="footer" class="footer">
    <footer>
      <div class="footer-follow">
        <p data-i18n="footer.text">
          &copy; 2026 lusca0x01 Blog. Todos os direitos reservados.
        </p>
      </div>
    </footer>
  </div>

  <script src="/assets/js/script.js"></script>
</body>

</html>
